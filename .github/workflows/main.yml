name: Data Preprocessing Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'diabetes_raw.csv'
      - 'preprocessing/automate_*.py'
      - '.github/workflows/preprocess.yml'
  
  workflow_dispatch:
  
  pull_request:
    branches:
      - main

jobs:
  preprocess-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install pandas numpy scikit-learn imbalanced-learn joblib matplotlib seaborn
        fi
    
    - name: Verify Raw Data
      run: |
        echo "Checking for diabetes_raw.csv..."
        if [ -f "diabetes_raw.csv" ]; then
          echo "✓ Raw data file exists in root"
          wc -l diabetes_raw.csv
        else
          echo "Error: diabetes_raw.csv not found!"
          ls -la
          exit 1
        fi
    
    - name: Run Preprocessing
      run: |
        cd preprocessing
        python automate_*.py
        cd ..
    
    - name: Verify Preprocessed Data
      run: |
        if [ ! -f "preprocessing/diabetes_preprocessing.csv" ]; then
          echo "Error: Preprocessed data not generated!"
          exit 1
        fi
        echo "✓ Preprocessed data generated successfully"
        wc -l preprocessing/diabetes_preprocessing.csv
        
        if [ ! -f "preprocessing/scaler.pkl" ]; then
          echo "Error: Scaler not generated!"
          exit 1
        fi
        echo "✓ Scaler generated successfully"
        ls -lh preprocessing/scaler.pkl
    
    - name: Display Preprocessing Info
      run: |
        echo "=== Preprocessing Completed ==="
        echo "Date: $(date)"
        echo "Raw data: $(wc -l < diabetes_raw.csv) lines"
        echo "Preprocessed data: $(wc -l < preprocessing/diabetes_preprocessing.csv) lines"
        echo "Files generated:"
        ls -lh preprocessing/diabetes_preprocessing.csv
        ls -lh preprocessing/scaler.pkl
    
    - name: Upload Preprocessed Data as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: preprocessed-data-${{ github.sha }}
        path: |
          preprocessing/diabetes_preprocessing.csv
          preprocessing/scaler.pkl
        retention-days: 30
    
    - name: Commit and Push Preprocessing Data
      if: github.event_name != 'pull_request'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add preprocessed files
        git add preprocessing/diabetes_preprocessing.csv preprocessing/scaler.pkl
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Commit changes
          git commit -m "Auto: Update preprocessed data [skip ci]"
          
          # Pull with rebase to sync with remote
          git pull --rebase origin main || true
          
          # Push changes (with retry logic)
          for i in {1..3}; do
            if git push origin main; then
              echo "Successfully pushed changes"
              break
            else
              echo "Push failed, retrying... ($i/3)"
              git pull --rebase origin main || true
              sleep 2
            fi
          done
        fi
    
    - name: Create Job Summary
      if: always()
      run: |
        echo "## 🎯 Preprocessing Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Data Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Raw Data Rows:** $(wc -l < diabetes_raw.csv)" >> $GITHUB_STEP_SUMMARY
        echo "- **Preprocessed Data Rows:** $(wc -l < preprocessing/diabetes_preprocessing.csv)" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Steps Completed" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Data loading" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Drop ID column" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Handle zero values" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Impute missing values" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Handle outliers (winsorizing)" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Data scaling" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Generate artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Files Generated" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **preprocessing/diabetes_preprocessing.csv** (committed to repo)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **preprocessing/scaler.pkl** (committed to repo)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Artifacts** (available for download for 30 days)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📍 File Locations" >> $GITHUB_STEP_SUMMARY
        echo "1. **In Repository:** Browse to \`preprocessing/\` folder" >> $GITHUB_STEP_SUMMARY
        echo "2. **As Artifacts:** Download from Artifacts section below" >> $GITHUB_STEP_SUMMARY
